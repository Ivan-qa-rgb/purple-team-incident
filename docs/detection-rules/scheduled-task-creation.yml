title: Suspicious Scheduled Task Creation
id: a7b8c9d0-e1f2-3456-0123-567890123456
status: experimental
description: Detects creation of scheduled tasks with suspicious names or commands.
author: Your Name
date: 2026/01/08
references:
  - https://attack.mitre.org/techniques/T1053/005/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    EventID: 4698
  suspicious_name:
    TaskName|contains:
      - 'update'
      - 'backup'
      - 'sync'
      - 'maintenance'
  condition: selection and suspicious_name
falsepositives:
  - Legitimate scheduled tasks created by IT team.
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
