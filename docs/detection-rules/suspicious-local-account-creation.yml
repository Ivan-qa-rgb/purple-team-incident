title: Suspicious Local Account Creation
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: Detects creation of local accounts with suspicious names or added to Administrators.
author: Your Name
date: 2026/01/08
references:
  - https://attack.mitre.org/techniques/T1136/001/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    EventID: 4720
  account_name:
    TargetUserName|contains:
      - 'svc-'
      - 'update-'
      - 'admin-'
      - 'backup-'
  condition: selection and account_name
falsepositives:
  - Legitimate service account creation during change window.
level: medium
tags:
  - attack.persistence
  - attack.t1136.001
