title: Suspicious Child Process from Web Server
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: Detects child processes of web server processes that may indicate exploitation.
author: Your Name
date: 2026/01/08
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1059/001/
logsource:
  category: process_creation
  product: windows
detection:
  parent:
    ParentImage|endswith:
      - '\\w3wp.exe'
      - '\\httpd.exe'
      - '\\nginx.exe'
  child:
    Image|endswith:
      - '\\cmd.exe'
      - '\\powershell.exe'
      - '\\pwsh.exe'
      - '\\wscript.exe'
      - '\\cscript.exe'
  condition: parent and child
falsepositives:
  - Legitimate admin scripts executed by web processes (rare).
level: high
tags:
  - attack.initial_access
  - attack.t1190
  - attack.execution
  - attack.t1059.001
