name: Validate Sigma Rules

on:
  push:
    branches: [main]
    paths:
      - 'docs/detection-rules/**.yml'
      - 'docs/detection-rules/**.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/detection-rules/**.yml'
      - 'docs/detection-rules/**.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sigma:
    name: Sigma CLI checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install sigma-cli and backends
        run: |
          python -m pip install --upgrade pip
          pip install sigma-cli
          sigma plugin install splunk || true
          sigma plugin install elasticsearch || true
          sigma plugin install microsoft365defender || true
          sigma plugin install crowdstrike || true

      - name: List installed plugins
        run: sigma plugin list

      - name: Validate all rules
        run: |
          set -e
          shopt -s nullglob
          files=(docs/detection-rules/*.yml docs/detection-rules/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Sigma rules found, skipping validation."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "==> Validating $f"
            sigma check "$f"
          done

      - name: Convert to Splunk (sanity check)
        run: |
          shopt -s nullglob
          files=(docs/detection-rules/*.yml docs/detection-rules/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Sigma rules found, skipping Splunk conversion."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "==> Converting $f to splunk"
            if ! sigma convert -t splunk -p splunk_windows "$f" >/dev/null 2>&1; then
              echo "::warning::Failed to convert $f to splunk"
            fi
          done

      - name: Convert to Elasticsearch (sanity check)
        run: |
          shopt -s nullglob
          files=(docs/detection-rules/*.yml docs/detection-rules/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Sigma rules found, skipping Elasticsearch conversion."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "==> Converting $f to elasticsearch"
            if ! sigma convert -t elasticsearch -p ecs_windows "$f" >/dev/null 2>&1; then
              echo "::warning::Failed to convert $f to elasticsearch"
            fi
          done
